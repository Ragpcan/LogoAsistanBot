<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo CRM Bot — Giriş</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #f1f4f9;
      --card: #ffffff;
      --indigo: #6366f1;
      --indigo-dark: #4f46e5;
      --indigo-light: #e0e1fd;
      --text: #1e2532;
      --muted: #8897ab;
      --border: #e2e8f4;
      --error: #f43f5e;
      --error-bg: #ffe4e8;
      --success: #10b981;
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(99,102,241,0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16,185,129,0.05) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    /* Logo/Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--indigo), #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.4rem;
      box-shadow: 0 8px 24px rgba(99,102,241,0.3);
    }

    .brand-text .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .brand-text .brand-sub {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* Card */
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.4rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
    }

    .login-card h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .login-card .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    /* Form */
    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.45rem;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.95rem;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 2.8rem;
      background: #f4f6fb;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.9rem;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--indigo);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    .form-control::placeholder { color: var(--muted); }

    /* Password toggle */
    .toggle-pw {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--muted);
      background: none;
      border: none;
      font-size: 0.95rem;
      padding: 0.2rem;
    }
    .toggle-pw:hover { color: var(--indigo); }

    /* Error alert */
    .alert-error {
      display: none;
      background: var(--error-bg);
      border: 1px solid rgba(244,63,94,0.3);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      font-size: 0.85rem;
      color: #9f1239;
      font-weight: 600;
      margin-bottom: 1.2rem;
      align-items: center;
      gap: 0.5rem;
    }

    /* Submit button */
    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--indigo), var(--indigo-dark));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(99,102,241,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99,102,241,0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login.loading {
      opacity: 0.75;
      pointer-events: none;
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .login-footer span {
      color: var(--indigo);
      font-weight: 600;
    }

    /* Animated bg dots */
    .bg-decoration {
      position: fixed;
      pointer-events: none;
      z-index: -1;
    }
    .bg-decoration.top-left {
      top: -100px; left: -100px;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.08), transparent 70%);
    }
    .bg-decoration.bottom-right {
      bottom: -100px; right: -100px;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16,185,129,0.06), transparent 70%);
    }
  </style>
</head>
<body>

  <div class="bg-decoration top-left"></div>
  <div class="bg-decoration bottom-right"></div>

  <div class="login-wrapper">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
      <div class="brand-text">
        <div class="brand-title">LOGO CRM BOT</div>
        <div class="brand-sub">Kurumsal ERP & Telegram Entegrasyonu</div>
      </div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <h2>👋 Hoş Geldiniz</h2>
      <p class="subtitle">Yönetim paneline erişmek için giriş yapın.</p>

      <div class="alert-error" id="errorAlert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorText">Kullanıcı adı veya şifre hatalı.</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username"><i class="fa-regular fa-user"></i> Kullanıcı Adı</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Şifre</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" onclick="togglePw()">
              <i class="fa-solid fa-eye" id="pwEyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          Giriş Yap
        </button>
      </form>
    </div>

    <div class="login-footer">
      Güvenli bağlantı &bull; &copy; 2025 <span>Logo CRM Bot</span>
    </div>

  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorAlert = document.getElementById('errorAlert');
      const errorText = document.getElementById('errorText');

      btn.classList.add('loading');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Giriş yapılıyor...';
      errorAlert.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json().catch(() => null);

        if (response.ok && data && data.isSuccess && data.user) {
          sessionStorage.setItem('logoCrmAuth', '1');
          sessionStorage.setItem('logoCrmUser', data.user.username);
          sessionStorage.setItem('logoCrmUserData', JSON.stringify(data.user));

          btn.innerHTML = '<i class="fa-solid fa-check"></i> Giriş başarılı! Yönlendiriliyor...';
          btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
          setTimeout(() => { window.location.href = '/index.html'; }, 600);
          return;
        }

        throw new Error(data?.message || 'Kullanıcı adı veya şifre hatalı.');
      } catch (err) {
        btn.classList.remove('loading');
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Giriş Yap';
        btn.style.background = '';
        errorText.textContent = err.message || 'Kullanıcı adı veya şifre hatalı.';
        errorAlert.style.display = 'flex';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }

    function togglePw() {
      const input = document.getElementById('password');
      const icon = document.getElementById('pwEyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
    });
  </script>
</body>
</html>
